<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MNAU Billing Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>MNAU <span>BILLING</span></h1>
    <button id="btn-new-order" class="btn-primary">+ Neuer Auftrag</button>
</header>

<main id="app-content">
    <div id="loading" class="spinner"></div>
    <div id="order-list" class="order-grid"></div>
</main>

<!-- Modal für neuen Auftrag -->
<div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
        <h2>Neuen Auftrag erfassen</h2>
        <form id="form-new-order">
            <label>Auftragsname / Projekt</label>
            <input type="text" id="input-name" required placeholder="z.B. Porsche GW Shooting">

            <label>Betrag Automotive (Netto)</label>
            <input type="number" step="0.01" id="input-betrag" required placeholder="0.00">

            <label>Fremdkosten (enthalten)</label>
            <input type="number" step="0.01" id="input-fremdkosten" placeholder="0.00">

            <div class="modal-actions">
                <button type="button" id="btn-cancel" class="btn-secondary">Abbrechen</button>
                <button type="submit" class="btn-primary">Speichern</button>
            </div>
        </form>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
